<!doctype html>
<html lang="en" data-theme="auto">
<head>

<title>Follow-up Desk</title>
<style>
/* Liquid Glass tokens, carried over from the Nexus design system: deep base, indigo to violet
   brand, glass layers, aurora light. Dark by default, light on request or by system setting. */
:root {
  --void: #06070d; --surface: #11141f;
  --p400: #818cf8; --p500: #6366f1; --p600: #7c3aed; --aurora: #22d3ee; --ember: #f472b6;
  --ok: #34d399; --warn: #fbbf24; --bad: #fb7185;
  --ink: #eef0fa; --dim: #9aa3bc; --faint: #5d6478;
  --glass: linear-gradient(135deg, rgba(255,255,255,.07), rgba(255,255,255,.025) 40%, rgba(255,255,255,.045));
  --edge: rgba(255,255,255,.1); --edge2: rgba(255,255,255,.22);
  --inner: inset 0 1px 0 rgba(255,255,255,.09), inset 0 -1px 0 rgba(0,0,0,.25);
  --shadow: 0 12px 40px -12px rgba(0,0,0,.65);
  --field: rgba(255,255,255,.05); --hover: rgba(255,255,255,.07);
  --blob1: rgba(99,102,241,.2); --blob2: rgba(34,211,238,.12); --blob3: rgba(124,58,237,.18);
  --font: "Geist", "SF Pro Display", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ease: cubic-bezier(.22,1,.36,1); --spring: cubic-bezier(.34,1.56,.64,1);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --void: #f2f3fb; --surface: #ffffff; --ink: #151a2d; --dim: #4b5472; --faint: #8a92ad;
    --glass: linear-gradient(135deg, rgba(255,255,255,.92), rgba(255,255,255,.74));
    --edge: rgba(30,35,90,.11); --edge2: rgba(30,35,90,.24);
    --inner: inset 0 1px 0 rgba(255,255,255,.95); --shadow: 0 10px 30px -14px rgba(40,50,120,.35);
    --field: rgba(30,35,90,.045); --hover: rgba(30,35,90,.06);
    --blob1: rgba(99,102,241,.14); --blob2: rgba(34,211,238,.1); --blob3: rgba(124,58,237,.1);
    --ok: #059669; --warn: #b45309; --bad: #e11d48; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --void: #f2f3fb; --surface: #ffffff; --ink: #151a2d; --dim: #4b5472; --faint: #8a92ad;
  --glass: linear-gradient(135deg, rgba(255,255,255,.92), rgba(255,255,255,.74));
  --edge: rgba(30,35,90,.11); --edge2: rgba(30,35,90,.24);
  --inner: inset 0 1px 0 rgba(255,255,255,.95); --shadow: 0 10px 30px -14px rgba(40,50,120,.35);
  --field: rgba(30,35,90,.045); --hover: rgba(30,35,90,.06);
  --blob1: rgba(99,102,241,.14); --blob2: rgba(34,211,238,.1); --blob3: rgba(124,58,237,.1);
  --ok: #059669; --warn: #b45309; --bad: #e11d48; color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--void); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; }
body { margin: 0; min-height: 100vh; font-size: 14.5px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--p400); outline-offset: 2px; border-radius: 6px; }
.aurora { position: fixed; inset: 0; z-index: -1; overflow: hidden; pointer-events: none; }
.aurora i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; filter: blur(90px); animation: drift 26s var(--ease) infinite alternate; }
.aurora i:nth-child(1) { background: var(--blob1); left: -20vmax; top: -30vmax; }
.aurora i:nth-child(2) { background: var(--blob2); right: -25vmax; top: -10vmax; animation-delay: -9s; }
.aurora i:nth-child(3) { background: var(--blob3); left: 20vmax; bottom: -45vmax; animation-delay: -17s; }
@keyframes drift { from { transform: translate3d(-4%, -3%, 0) rotate(0); } to { transform: translate3d(5%, 4%, 0) rotate(30deg); } }
.glass { background: var(--glass); border: 1px solid var(--edge); border-radius: 1.1rem; box-shadow: var(--inner), var(--shadow);
  backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); }
.app { max-width: 1100px; margin: 0 auto; padding: 12px; display: grid; gap: 10px; }
.topbar { display: flex; align-items: center; gap: 10px 14px; padding: 8px 12px; position: sticky; top: 8px; z-index: 5; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; letter-spacing: -.01em; }
.logo { width: 30px; height: 30px; border-radius: 10px; background: linear-gradient(135deg, var(--p500), var(--p600)); display: grid; place-items: center; color: #fff; box-shadow: 0 8px 22px -8px rgba(99,102,241,.8); }
.days { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; overflow-x: auto; }
.day { padding: 3px 10px; border-radius: 10px; border: 1px solid transparent; color: var(--dim); font-size: 12px; white-space: nowrap; line-height: 1.25; }
.day b { display: block; color: var(--ink); font-size: 12.5px; }
.day.done { background: var(--field); } .day.done b::before { content: "✓ "; color: var(--ok); }
.day.next { border-color: var(--p500); background: rgba(99,102,241,.13); }
.tools { display: flex; gap: 6px; align-items: center; position: relative; }
.btn { border: 1px solid var(--edge); background: var(--field); border-radius: 11px; padding: 6px 12px; cursor: pointer; font-weight: 550; transition: transform .2s var(--spring), background .15s, box-shadow .2s; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--hover); border-color: var(--edge2); } .btn:active { transform: scale(.97); }
.btn[disabled] { opacity: .5; pointer-events: none; }
.btn.primary { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--p500), var(--p600)); box-shadow: 0 8px 26px -8px rgba(99,102,241,.7); }
.btn.primary:hover { filter: brightness(1.08); } .btn.good { color: var(--ok); } .btn.bad { color: var(--bad); }
.btn.small { padding: 3px 9px; font-size: 12.5px; border-radius: 9px; } .btn.icon { padding: 6px 9px; }
.badge { position: absolute; top: -4px; right: -4px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--ember); color: #fff; font-size: 10px; display: grid; place-items: center; pointer-events: none; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
.avatar.big { width: 44px; height: 44px; font-size: 16px; }
.me { padding: 3px 10px 3px 4px; border-radius: 999px; }
.pop { position: absolute; right: 0; top: calc(100% + 8px); min-width: 280px; max-width: min(380px, 92vw); padding: 10px; z-index: 30; background: var(--surface); animation: pop .18s var(--ease); }
.pop h4 { margin: 2px 4px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.pop .item { padding: 7px 8px; border-radius: 9px; font-size: 13px; } .pop .item + .item { border-top: 1px solid var(--edge); }
.pop .menu { display: grid; gap: 4px; } .pop select { width: 100%; }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } }
.tabs { display: flex; gap: 3px; padding: 4px; overflow-x: auto; border-radius: 14px; }
.tab { border: 0; background: transparent; padding: 6px 14px; border-radius: 10px; color: var(--dim); font-weight: 550; cursor: pointer; white-space: nowrap; position: relative; }
.tab:hover { color: var(--ink); }
.tab.on { color: #fff; background: linear-gradient(135deg, var(--p500), var(--p600)); box-shadow: 0 6px 18px -8px rgba(99,102,241,.7); }
.tab .dot { margin-left: 6px; padding: 0 6px; border-radius: 8px; background: var(--ember); color: #fff; font-size: 10.5px; }
.panel { padding: 14px 16px; min-width: 0; }
.panel h2 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
.panel h3, .drawer h3 { margin: 12px 0 6px; font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.sub { color: var(--dim); margin: 2px 0 8px; }
.head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 4px; } .head .grow { flex: 1; }
.banner { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 12px; background: linear-gradient(135deg, rgba(99,102,241,.16), rgba(34,211,238,.08)); border: 1px solid rgba(129,140,248,.3); font-size: 13px; }
.banner b { color: var(--p400); }
.cards { display: grid; gap: 6px; }
.card { display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 12px; background: var(--field); border: 1px solid var(--edge); cursor: pointer; text-align: left; width: 100%; transition: transform .22s var(--spring), border-color .2s; }
.card:hover { transform: translateY(-1px); border-color: var(--edge2); }
.card .ico { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; font-size: 15px; flex: none; }
.card .body { flex: 1; min-width: 0; } .card .body b { display: block; } .card .body small { color: var(--dim); }
.ico.a { background: rgba(99,102,241,.2); } .ico.r { background: rgba(251,191,36,.18); } .ico.q { background: rgba(34,211,238,.16); } .ico.h { background: rgba(251,113,133,.18); } .ico.t { background: rgba(52,211,153,.16); }
.clear { display: flex; align-items: center; gap: 8px; color: var(--dim); padding: 8px 2px; } .clear b { color: var(--ok); }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 999px; font-size: 11.5px; font-weight: 600; background: var(--field); border: 1px solid var(--edge); color: var(--dim); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.1); }
.chip.warn { color: var(--warn); border-color: rgba(251,191,36,.4); background: rgba(251,191,36,.1); }
.chip.bad { color: var(--bad); border-color: rgba(251,113,133,.4); background: rgba(251,113,133,.1); }
.chip.info { color: var(--p400); border-color: rgba(129,140,248,.4); background: rgba(99,102,241,.12); }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; padding: 1px 6px; border-radius: 6px; background: var(--field); border: 1px solid var(--edge); }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; } .toolbar input { max-width: 200px; padding: 5px 10px; }
.seg { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--field); border: 1px solid var(--edge); }
.seg button { border: 0; background: transparent; padding: 3px 10px; border-radius: 8px; cursor: pointer; color: var(--dim); font-size: 12.5px; } .seg button.on { background: var(--hover); color: var(--ink); }
.rows { display: grid; gap: 4px; }
.row { display: grid; grid-template-columns: minmax(0, 2.2fr) minmax(0, 1.3fr) 82px auto auto; gap: 10px; align-items: center; padding: 7px 11px; border-radius: 11px; background: var(--field); border: 1px solid var(--edge); cursor: pointer; text-align: left; width: 100%; transition: border-color .2s, transform .22s var(--spring); }
.row:hover { border-color: var(--edge2); transform: translateY(-1px); }
.row b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .row small { color: var(--dim); }
.row.plain { cursor: default; } .row.plain:hover { transform: none; }
details.done { margin-top: 6px; } details.done summary { cursor: pointer; color: var(--dim); font-size: 12.5px; padding: 4px 2px; } details.done[open] summary { margin-bottom: 4px; }
.table { width: 100%; border-collapse: collapse; } .table th { text-align: left; font-size: 11.5px; color: var(--faint); font-weight: 600; padding: 4px 8px; }
.table td { padding: 7px 8px; border-top: 1px solid var(--edge); vertical-align: middle; } .table td .avatar { margin-right: 6px; }
.split { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 12px; }
.split.one { grid-template-columns: minmax(0, 1fr); }
.threads { display: grid; gap: 4px; align-content: start; }
.thread { padding: 7px 10px; border-radius: 10px; border: 1px solid transparent; background: var(--field); cursor: pointer; text-align: left; }
.thread.on { border-color: rgba(129,140,248,.5); background: rgba(99,102,241,.14); } .thread small { display: block; color: var(--dim); }
.bubbles { display: grid; gap: 7px; align-content: start; max-height: 46vh; overflow: auto; padding-right: 3px; }
.bubble { max-width: 86%; padding: 7px 11px; border-radius: 14px 14px 14px 4px; background: var(--field); border: 1px solid var(--edge); }
.bubble.mine { justify-self: end; border-radius: 14px 14px 4px 14px; background: linear-gradient(135deg, rgba(99,102,241,.35), rgba(124,58,237,.3)); border-color: rgba(129,140,248,.4); }
.bubble.bot { border-color: rgba(34,211,238,.4); background: rgba(34,211,238,.08); }
.bubble small { display: block; color: var(--dim); font-size: 11.5px; } .bubble blockquote { margin: 2px 0 0; padding-left: 9px; border-left: 3px solid var(--aurora); }
.compose { display: flex; gap: 6px; margin-top: 8px; }
input, select, textarea { width: 100%; padding: 8px 11px; border-radius: 11px; background: var(--field); border: 1px solid var(--edge); }
textarea { resize: vertical; min-height: 56px; }
label { display: grid; gap: 4px; font-size: 12.5px; color: var(--dim); font-weight: 550; }
.fields { display: grid; gap: 8px; } .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.drawer-bg { position: fixed; inset: 0; background: rgba(3,4,10,.45); backdrop-filter: blur(2px); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
.drawer-bg.on { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 8px; right: 8px; bottom: 8px; width: min(520px, calc(100vw - 16px)); z-index: 21; padding: 16px 18px; overflow: auto; transform: translateX(108%); transition: transform .26s var(--ease); border-radius: 1.4rem; background: var(--surface); }
.drawer.on { transform: none; } .drawer.wide { width: min(760px, calc(100vw - 16px)); }
.drawer .x { position: absolute; top: 12px; right: 12px; }
.drawer h2 { margin: 0 34px 2px 0; font-size: 18px; }
.sect { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--edge); } .sect > h3:first-child { margin-top: 0; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.brief ul { margin: 2px 0 6px; padding-left: 18px; } .brief li { margin: 1px 0; } .brief .goal { font-weight: 600; margin-bottom: 4px; } .brief .chips { display: flex; gap: 5px; flex-wrap: wrap; margin: 4px 0; }
.q { padding: 8px 11px; border-radius: 12px; background: var(--field); border: 1px solid var(--edge); display: grid; gap: 6px; margin-bottom: 6px; }
.q .num { color: var(--p400); font-weight: 700; margin-right: 6px; }
.answer { padding: 5px 10px; border-radius: 9px; background: rgba(52,211,153,.08); border-left: 3px solid var(--ok); }
.warnbox { padding: 7px 11px; border-radius: 11px; background: rgba(251,191,36,.1); border: 1px solid rgba(251,191,36,.4); font-size: 13px; }
.gaps { margin: 4px 0 0; padding: 0; list-style: none; display: grid; gap: 3px; } .gaps li::before { content: "◦ "; color: var(--warn); }
.login { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
.login .box { width: min(400px, 100%); padding: 22px; display: grid; gap: 10px; }
.login h1 { margin: 6px 0 0; font-size: 22px; letter-spacing: -.02em; } .login .tools { position: absolute; top: 14px; right: 14px; }
.err { color: var(--bad); font-size: 13px; min-height: 18px; }
.demo { display: flex; gap: 5px; flex-wrap: wrap; } .demo button { cursor: pointer; }
.toasts { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: grid; gap: 6px; z-index: 40; }
.toast { padding: 8px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--edge2); box-shadow: var(--shadow); animation: pop .3s var(--spring); }
.toast.bad { border-color: rgba(251,113,133,.6); } .toast.ok { border-color: rgba(52,211,153,.6); }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: turn .7s linear infinite; }
@keyframes turn { to { transform: rotate(360deg); } }
.flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.flow div, .guide article { padding: 9px 12px; border-radius: 12px; background: var(--field); border: 1px solid var(--edge); } .flow b { display: block; }
.guide { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; } .guide h4 { margin: 0 0 2px; } .guide p, .flow p { margin: 0; color: var(--dim); font-size: 13px; }
.bar { height: 7px; border-radius: 4px; background: var(--field); overflow: hidden; } .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--p500), var(--aurora)); }
@media (max-width: 760px) {
  .split { grid-template-columns: 1fr; } .flow { grid-template-columns: 1fr 1fr; } .two { grid-template-columns: 1fr; }
  .row { grid-template-columns: 1fr auto; } .row > :nth-child(2), .row > :nth-child(3) { display: none; }
  .topbar { position: static; flex-wrap: wrap; } .days { order: 3; flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>

async function api(path, body) {
  const opts = body === undefined ? {} : { method: "POST", headers: { "Content-Type": "application/json", "X-Followup": "1" }, body: JSON.stringify(body) };
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/api/login") { S.person = null; S.board = null; render(); throw new Error(data.error || "sign in"); }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
function toast(msg, kind = "") { const el = document.createElement("div"); el.className = "toast " + kind; el.textContent = msg; $("#toasts").append(el); setTimeout(() => el.remove(), 3800); }

const avatar = (name, big = false) => html`<span class="avatar ${big ? "big" : ""}" style="background:linear-gradient(135deg,hsl(${hue(name)} 70% 55%),hsl(${(hue(name) + 45) % 360} 70% 42%))">${name.split(/\s+/).map(w => w[0]).slice(0, 2).join("")}</span>`;
const chip = (kind, text) => html`<span class="chip ${kind}">${text}</span>`;
const STATUS = { none: ["", "noCheck"], open: ["info", "openCheck"], answered: ["info", "answered"], needs_review: ["warn", "needsReview"], pass: ["ok", "pass"], fail: ["bad", "fail"] };

function needs() {
  const b = S.board, items = [];
  b.mine.filter(c => c.can_answer).forEach(c => items.push({ i: "a", title: t("answerCheck"), sub: `${c.task_id} · ${c.title}`, act: "task", arg: c.task_id }));

  b.threads.filter(th => !th.closed).forEach(th => { const last = [...th.posts].reverse().find(p => !p.assistant); if (th.waiting && last && !last.mine) items.push({ i: "q", title: t("questionWaits"), sub: `${th.task_id || ""} ${th.subject}`, act: "thread", arg: th.thread_id }); });

  const item = x => html`<button class="thread ${x.thread_id === S.thread ? "on" : ""}" data-act="thread" data-arg="${x.thread_id}"><b>${x.kind === "support" ? "🛟 " : ""}${x.subject}</b><small>${x.task_id}</small>${x.waiting ? chip("warn", t("waiting")) : ""}</button>`;
  return html`<div class="toolbar"><button class="btn small" data-act="ask">+ ${t("ask")}</button><button class="btn small" data-act="ticket">+ ${t("support")}</button></div>
  ${b.threads.length ? html`<div class="split ${many ? "" : "one"}">${many ? html`<div class="threads">${open.map(item)}${done.length ? html`<details class="done"><summary>${t("doneThreads", { n: done.length })}</summary>${done.map(item)}</details>` : ""}</div>` : ""}
    <div>${th ? thread(th) : ""}</div></div>` : html`<p class="sub">${t("noThreads")}</p>`}`;
}
function thread(th) {
  return html`<div class="head"><b class="grow">${th.subject}</b>${th.closed ? chip("ok", "✓") : html`<button class="btn small good" data-act="done" data-arg="${th.thread_id}">✓ ${t("markDone")}</button>`}</div>
  <div class="bubbles">${th.posts.map(p => html`<div class="bubble ${p.mine ? "mine" : ""} ${p.assistant ? "bot" : ""}"><small>${p.assistant ? "✨ " + t("assistant") : p.author} · ${p.day}</small>${p.quoted ? html`<blockquote>${p.text}</blockquote>` : p.text}</div>`)}</div>
  <form class="compose" data-form="reply" data-arg="${th.thread_id}"><input name="text" placeholder="${t("writeMsg")}" required autocomplete="off"><button class="btn primary">${t("sendMsg")}</button></form>`;
}
function team() {
  const b = S.board, line = b.issued;
  const stat = name => { const mine = line.filter(c => c.assignee === name); return { open: mine.filter(c => c.task_status !== "Done").length, pass: mine.filter(c => c.status === "pass").length, fail: mine.filter(c => c.status === "fail").length, wait: mine.filter(c => ["open", "answered", "needs_review"].includes(c.status)).length }; };
  return html`<h3>${t("levels")}</h3>${b.trust === null ? html`<div class="warnbox">${t("hiddenLevels")}</div>` : b.trust.length ? html`<table class="table"><thead><tr><th>${t("person")}</th><th>${t("role")}</th><th>${t("level")}</th><th>${t("results")}</th><th>${t("open2")}</th><th>${t("checks")}</th><th></th></tr></thead><tbody>${b.trust.map(p => { const s = stat(p.name); return html`<tr><td>${avatar(p.name)}${p.name}</td><td>${p.role.replace("_", " ")}</td><td>${chip(LEVEL[p.level], p.level)}${p.probation ? chip("", "new") : ""}</td><td>${p.results}</td><td>${s.open}</td><td>${s.pass ? chip("ok", "✓ " + s.pass) : ""} ${s.fail ? chip("bad", "✕ " + s.fail) : ""} ${s.wait ? chip("info", "… " + s.wait) : ""}</td><td>${p.halted ? html`<button class="btn small" data-act="clear" data-arg="${p.person_id}">${t("clearHold")}</button>` : ""}</td></tr>`; })}</tbody></table>` : html`<p class="sub">${t("noLine")}</p>`}
  <h3>${t("models")}</h3>${b.models && b.models.length ? html`<div class="rows">${b.models.map(m => html`<div class="row plain" style="grid-template-columns:minmax(0,1fr) 150px auto"><span><b>${m.feature}</b><small>${m.model} · ${m.results}</small></span><div class="bar"><i style="width:${Math.round((m.pass_rate ?? 0) * 100)}%"></i></div>${chip(LEVEL[m.level], m.pass_rate == null ? "–" : Math.round(m.pass_rate * 100) + "% " + t("passRate"))}</div>`)}</div>` : html`<p class="sub">${t("noModels")}</p>`}
  <p class="sub" style="margin-top:10px">🛡 ${t("ethics")}</p>`;
}
function guideHtml() {
  return html`<h2>${t("guide")}</h2><h3>${t("tasks")}</h3><div class="flow">${[1, 2, 3, 4].map(n => html`<div><b>${t("flow" + n)}</b><p>${t("flow" + n + "d")}</p></div>`)}</div><p class="sub" style="margin-top:8px">🛡 ${t("ethics")}</p>`;
}

// ---- the drawer: one task, one new task, one question --------------------------------------
function briefHtml(br) {
  if (!br) return "";
  const list = (title, items) => items.length ? html`<h3>${title}</h3><ul>${items.map(i => html`<li>${i}</li>`)}</ul>` : "";
  return html`<div class="brief"><div class="goal">${br.goal}</div>${list(t("requirements"), br.requirements)}
    ${br.limits.length ? html`<div class="chips">${br.limits.map(l => chip("info", l))}</div>` : ""}
    ${br.names.length ? html`<div class="chips">${br.names.map(n => html`<code>${n}</code>`)}</div>` : ""}${list(t("other"), br.other)}</div>`;
}
function taskPanel(c) {
  const th = S.board.threads.find(x => x.task_id === c.task_id && x.kind === "task");
  const quiz = c.questions.length ? html`<div class="sect"><h3>${t("check")} ${checkChip(c)}</h3>${c.missing.length ? html`<div class="warnbox"><b>${t("notFound")}:</b> ${c.missing.map(m => html`<code>${m}</code> `)}<div style="color:var(--dim);margin-top:3px">${t("notFoundHint")}</div></div>` : ""}
    ${c.can_answer ? html`<form data-form="answer" data-arg="${c.task_id}">${c.questions.filter(q => q.graded).map(q => html`<div class="q"><div><span class="num">${q.number}</span>${q.prompt}</div><textarea name="q${q.number}" placeholder="${t("yourAnswer")}" required></textarea></div>`)}${c.questions.filter(q => !q.graded).map(q => html`<div class="q"><div><span class="num">${q.number}</span>${q.prompt} ${chip("", t("notScored"))}</div></div>`)}<button class="btn primary">${t("send")}</button></form>`
      : html`${c.questions.map(q => html`<div class="q"><div><span class="num">${q.number}</span>${q.prompt} ${q.graded ? "" : chip("", t("notScored"))}</div>${q.answer ? html`<div class="answer">${q.answer}</div>` : ""}</div>`)}`}
    ${c.can_review ? html`<form data-form="review" data-arg="${c.task_id}"><label>${t("note")}<input name="note"></label><div class="actions"><button class="btn good" data-accept="1">${t("accept2")}</button><button class="btn bad" data-accept="0">${t("reject")}</button></div></form>` : ""}</div>` : "";
  return html`<button class="btn x small" data-act="close" aria-label="close">✕</button><h2>${c.task_id} · ${c.title}</h2>
  <div class="sub">${c.assignee}${c.issuer ? " ← " + c.issuer : ""} · ${c.project}${c.due ? " · " + t("due") + " " + c.due : ""}</div><div>${chip("", c.task_status)} ${checkChip(c)}</div>
  <div class="actions">${c.can_accept ? html`<button class="btn primary" data-act="accept" data-arg="${c.task_id}">▶ ${t("accept")}</button>` : ""}${c.can_submit ? html`<button class="btn ${c.can_accept ? "" : "primary"}" data-act="submit" data-arg="${c.task_id}">✓ ${t("handIn")}</button>` : ""}</div>
  ${c.can_return ? html`<form class="compose" data-form="return" data-arg="${c.task_id}"><input name="note" placeholder="${t("why")}" required><button class="btn bad">↩ ${t("sendBack")}</button></form>` : ""}
  ${c.brief ? html`<div class="sect"><h3>${t("brief")}</h3>${briefHtml(c.brief)}</div>` : ""}${quiz}
  <div class="sect"><h3>${t("chat")}</h3>${th ? html`<div class="bubbles">${th.posts.slice(-4).map(p => html`<div class="bubble ${p.mine ? "mine" : ""} ${p.assistant ? "bot" : ""}"><small>${p.assistant ? "✨ " + t("assistant") : p.author}</small>${p.quoted ? html`<blockquote>${p.text}</blockquote>` : p.text}</div>`)}</div>` : ""}
    <form class="compose" data-form="say" data-arg="${c.task_id}"><input name="text" placeholder="${t("writeMsg")}" required autocomplete="off"><button class="btn primary">${t("sendMsg")}</button></form></div>`;
}
function newTaskPanel() {
  const b = S.board, d = S.draft || (S.draft = { title: "", assignee: b.assignable[0]?.id || "", project: "", due: "", spec: "" });
  return html`<button class="btn x small" data-act="close" aria-label="close">✕</button><h2>${t("newTask")}</h2>
  <form data-form="new" class="fields"><div class="two"><label>${t("title")}<input name="title" value="${d.title}" required></label><label>${t("assignee")}<select name="assignee">${b.assignable.map(p => html`<option value="${p.id}" ${p.id === d.assignee ? "selected" : ""}>${p.name} · ${p.role.replace("_", " ")}</option>`)}</select></label></div>
  <div class="two"><label>${t("project")}<input name="project" value="${d.project}"></label><label>${t("dueDate")}<input name="due" type="date" value="${d.due}"></label></div>
  <label>${t("spec")}<textarea name="spec" rows="6" required>${d.spec}</textarea></label>
  <div class="sect" style="margin-top:2px"><h3>✨ ${t("helper")}</h3><div id="live">${liveBrief(null)}</div></div>
  <button class="btn primary" style="justify-content:center">${t("create")}</button></form>`;
}
function liveBrief(br) {
  if (!br) return html`<p class="sub" style="margin:0">${t("helperHint")}</p>`;
  return html`${briefHtml(br)}${br.gaps.length ? html`<h3>${t("gaps")}</h3><ul class="gaps">${br.gaps.map(g => html`<li>${g}</li>`)}</ul>` : html`<p class="sub">✓ ${t("looksGood")}</p>`}`;
}
function simplePanel(title, body, form, arg) {
  return html`<button class="btn x small" data-act="close" aria-label="close">✕</button><h2>${title}</h2><form class="fields" data-form="${form}" data-arg="${arg || ""}">${body}<button class="btn primary" style="justify-content:center">${t("sendMsg")}</button></form>`;
}
function renderDrawer() {
  const el = $("#drawer"), d = S.drawer;
  if (!d || !S.board) { el.classList.remove("on", "wide"); $("#bg").classList.remove("on"); return; }
  let content = "";
  if (d.type === "task") { const c = all().find(x => x.task_id === d.id); if (!c) return closeDrawer(); content = taskPanel(c); }
  else if (d.type === "new") content = newTaskPanel();
  else if (d.type === "guide") content = html`<button class="btn x small" data-act="close" aria-label="close">✕</button>${guideHtml()}`;
  else if (d.type === "ask") { const mine = all().filter(c => c.can_submit || c.issuer === S.board.viewer.name); content = simplePanel(t("ask"), html`<label>${t("tasks")}<select name="task">${mine.map(c => html`<option value="${c.task_id}">${c.task_id} · ${c.title}</option>`)}</select></label><label>${t("writeMsg")}<textarea name="text" required></textarea></label>`, "ask"); }
  else if (d.type === "ticket") content = simplePanel(t("support"), html`<label>${t("writeMsg")}<textarea name="text" required></textarea></label>`, "ticket");
  el.innerHTML = content.s; el.classList.toggle("wide", d.type === "new"); el.classList.add("on"); $("#bg").classList.add("on");
}
function openDrawer(d) { S.drawer = d; S.pop = null; render(); }
function closeDrawer() { S.drawer = null; S.draft = null; renderDrawer(); }

async function act(fn, ok, keepDrawer = false) {
  try { const r = await fn(); if (ok) toast(ok, "ok"); await loadBoard(); if (!keepDrawer) { S.drawer = null; S.draft = null; } S.pop = null; render(); return r; }
  catch (e) { if (e.message !== "sign in") toast(e.message || t("failed"), "bad"); }
}

// ---- events -----------------------------------------------------------------------------
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act],[data-accept],#bg");
  if (!e.target.closest(".pop, [data-act='pop']") && S.pop) { S.pop = null; render(); }
  if (!el) return;
  if (el.id === "bg") return closeDrawer();
  const a = el.dataset.act, arg = el.dataset.arg;
  if (el.dataset.accept !== undefined) { e.preventDefault(); const f = el.closest("form"); return act(() => api("/api/review", { task: f.dataset.arg, accept: el.dataset.accept === "1", note: f.note.value }), t("reviewed")); }
  if (a === "pop") { S.pop = S.pop === arg ? null : arg; render(); e.stopPropagation(); }
  else if (a === "tab") { S.tab = arg; render(); }
  else if (a === "theme") { S.theme = { auto: "dark", dark: "light", light: "auto" }[S.theme]; document.documentElement.dataset.theme = S.theme; try { localStorage.setItem("fd.theme", S.theme); } catch (x) {} render(); }
  else if (a === "fill") { const f = el.closest("form"); f.person.value = arg; f.password.value = el.dataset.pw; }
  else if (a === "filter") { S.filter = arg; render(); }
  else if (a === "task") openDrawer({ type: "task", id: arg });
  else if (a === "new") openDrawer({ type: "new" });
  else if (a === "guide") openDrawer({ type: "guide" });
  else if (a === "ask") openDrawer({ type: "ask" });
  else if (a === "ticket") openDrawer({ type: "ticket" });
  else if (a === "thread") { S.tab = "messages"; S.thread = arg; S.drawer = null; render(); }
  else if (a === "close") closeDrawer();
  else if (a === "logout") { try { await api("/api/logout", {}); } catch (x) {} S.person = null; S.board = null; S.drawer = null; S.demo = await fetch("/api/demo").then(r => r.json()).catch(() => []); render(); }
  else if (a === "accept") act(() => api("/api/task/accept", { task: arg }), t("accepted"), true);
  else if (a === "submit") act(() => api("/api/task/submit", { task: arg }), t("handedIn"), true);
  else if (a === "done") act(() => api("/api/done", { thread: arg }), "✓");
  else if (a === "clear") act(() => api("/api/clear", { person: arg }), "✓");
  else if (a === "advance") { S.busy = true; render(); try { const r = await api("/api/advance", {}); toast(t("dayRan", { date: r.date, n: r.notices, u: r.undelivered }), "ok"); S.info = (await api("/api/session")).scenario; await loadBoard(); } catch (x) { toast(x.message, "bad"); } S.busy = false; render(); }
});
document.addEventListener("change", e => { if (e.target.dataset.act === "lang") { S.lang = e.target.value; try { localStorage.setItem("fd.lang", S.lang); } catch (x) {} render(); } });
let assistTimer;
document.addEventListener("input", e => {
  if (e.target.dataset.act === "search") { S.q = e.target.value; const v = $("#view"); const pos = e.target.selectionStart; v.innerHTML = view().s; const i = $("input[data-act=search]"); i.focus(); i.setSelectionRange(pos, pos); return; }
  const form = e.target.closest("form[data-form=new]"); if (!form) return;
  S.draft = { title: form.title.value, assignee: form.assignee.value, project: form.project.value, due: form.due.value, spec: form.spec.value };
  clearTimeout(assistTimer);
  assistTimer = setTimeout(async () => { try { const br = await api("/api/assist/spec", { spec: S.draft.spec, assignee: S.draft.assignee, due: S.draft.due }); const live = $("#live"); if (live && S.draft.spec.trim()) live.innerHTML = liveBrief(br).s; } catch (x) {} }, 450);
});
document.addEventListener("submit", async e => {
  const form = e.target.closest("form[data-form]"); if (!form) return; e.preventDefault();
  const kind = form.dataset.form, arg = form.dataset.arg, text = form.text?.value;
  if (kind === "login") { S.error = ""; try { const r = await api("/api/login", { person: form.person.value, password: form.password.value }); S.person = r.person; const s = await api("/api/session"); S.info = s.scenario; await loadBoard(); S.tab = "overview"; } catch (x) { S.error = t("wrong"); } return render(); }
  if (kind === "answer") { const answers = {}; [...form.elements].filter(x => /^q\d+$/.test(x.name)).forEach(x => answers[x.name.slice(1)] = x.value); return act(() => api("/api/answer", { task: arg, answers }), t("saved")); }
  if (kind === "reply") return act(() => api("/api/reply", { thread: arg, text }), "");
  if (kind === "say") return act(() => api("/api/chat", { task: arg, text }), "", true);
  if (kind === "return") return act(() => api("/api/task/return", { task: arg, note: form.note.value }), t("sentBack"));
  if (kind === "ask") return act(() => api("/api/chat", { task: form.task.value, text }).then(r => { S.tab = "messages"; S.thread = r.thread; }), t("sent"));
  if (kind === "ticket") return act(() => api("/api/ticket", { text }).then(r => { S.tab = "messages"; S.thread = r.thread; }), t("ticketOpened"));
  if (kind === "new") { const who = S.board.assignable.find(p => p.id === form.assignee.value); return act(() => api("/api/task/new", { title: form.title.value, assignee: form.assignee.value, project: form.project.value, due: form.due.value, spec: form.spec.value }).then(r => toast(t("created", { id: r.task, name: who?.name || "" }), "ok")), ""); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { S.pop = null; closeDrawer(); render(); } });
init().catch(e => { document.body.insertAdjacentHTML("beforeend", `<p style="padding:24px">${esc(e.message)}</p>`); });
</script>
</body>
</html>
