name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Format check
        run: ruff format --check src tests
      - name: Test
        run: pytest
      - name: Demo walkthrough, then check nothing was sent twice
        run: |
          make demo
          for log in out/delivery_log.jsonl out/flaky/delivery_log.jsonl out/model/delivery_log.jsonl; do
            test "$(wc -l < "$log")" -eq 7
            test "$(cut -d'"' -f8 "$log" | sort -u | wc -l)" -eq 7
          done
